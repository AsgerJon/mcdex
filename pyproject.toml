#  The packaging of mcdex. The release buttons own the version line:
#  bin/release_tooling/version_stamp.py rewrites the first line whose
#  stripped form starts with 'version' at every press, so no line above
#  it may start with that word and it is never edited by hand.

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "mcdex"
version = "0.2.0-dev0"
description = """\
  A typed, version-agnostic catalogue of Minecraft for Python: every \
  item, block, entity, sound and more, with one identity across \
  all versions and the game's own id in each. Not affiliated with \
  Mojang or Microsoft.\
  """
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Asger Jon Vistisen", email = "asgerjon2@gmail.com" }]
requires-python = ">=3.14"
#  The same as requirements.txt, which the release workflows' test jobs
#  install.
dependencies = ["worktoy>=1.2.2"]
keywords = [
  "minecraft",
  "catalogue",
  "items",
  "blocks",
  "entities",
  "versions",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Games/Entertainment",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/AsgerJon/mcdex"
"Bug Tracker" = "https://github.com/AsgerJon/mcdex/issues"

[dependency-groups]
test = [
  "pytest>=9.2",
  "pytest-cov>=7.1",
  "coverage>=7.17",
  "cosmic-ray>=8.7",
]
#  The same packages as docs/requirements.txt.
docs = [
  "sphinx>=7",
  "furo>=2024.1",
  "markwork>=0.1.0",
]
dev = [
  { include-group = "test" },
  { include-group = "docs" },
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
#  Each catalogue's data file sits in its own package beside its module,
#  as 'items/items.json'. The glob takes a new catalogue's file with no
#  edit here.
mcdex = ["py.typed", "*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["mcdex"]

[tool.coverage.report]
fail_under = 100
show_missing = true
